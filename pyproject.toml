[project]
name = "graph-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "asyncmy>=0.2.10",
    "pydantic-settings>=2.6.0",
    "omegaconf>=2.3.0",
    "pymilvus>=2.5.0",
    "uvicorn[standard]>=0.35.0",
    "alembic>=1.16,<2",
    "celery>=5.5,<6",
    "httpx>=0.28,<1",
    "minio>=7.2,<8",
    "python-multipart>=0.0.20,<1",
    "charset-normalizer>=3.4,<4",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "markdown-it-py>=4,<5",
    "PyYAML>=6,<7",
    "jieba>=0.42,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "respx>=0.22,<1",
]

[tool.setuptools]
py-modules = ["main"]
